name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: event-backend-nio-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"

jobs:
  test-abcl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: egao1980/cl-repository/.github/actions/setup-client@main
      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          install-sbcl: "false"
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - name: Install ABCL
        shell: bash
        run: |
          ros install abcl-bin
          ros use abcl-bin
      - name: cl-repo install deps
        shell: bash
        run: |
          ros -l scripts/ci-install.lisp -q
      - name: Test
        shell: bash
        run: |
          ros -l scripts/ci-test.lisp -q
